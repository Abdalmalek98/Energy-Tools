[workspace]
members = ["licensing-core"]
resolver = "2"

[package]
name = "chiller-plant-analyzer"
version = "1.0.0"
edition = "2021"
description = "Chiller Plant Analyzer – Windows desktop application"
publish = false

[lib]
name = "chiller_plant_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
licensing-core = { path = "licensing-core" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
