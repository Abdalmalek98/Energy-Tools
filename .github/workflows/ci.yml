name: CI
on: { push: { branches: ["**"] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test                     # shared (incl. golden export), service (Miniflare), app (licence logic, .lsr)
      - name: E2E (Electron under xvfb, mock service)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64 libgtk-3-0t64
          node app/e2e/prepare.mjs && cd app && xvfb-run -a npx playwright test
