name: CI
on: { push: { branches: ["**"] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64 libgtk-3-0t64 libreoffice-calc
      - run: npm ci
      - run: npm run typecheck
      - run: npm test                       # licensing, shared (golden export incl. LibreOffice), server (real client vs real server, offline-license.sh), app
      - name: E2E (real Electron app + real server, xvfb)
        run: node app/e2e/prepare.mjs && cd app && xvfb-run -a npx playwright test
